# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52840"

[matrix]
matrix_type="direct_pin"
direct_pins = [["P0_09", "P0_10"], ["P0_11", "P0_13"]]

[layout]
rows = 2
cols = 2
layers = 2
keymap = [
    [
        ["A", "B"],
        ["Kc1", "Kc2"]
    ],
    [
        ["TT(1)", "TG(2)"],
        ["_", "_"]
    ],
]
